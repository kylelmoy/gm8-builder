name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  publish:
    strategy:
      matrix:
        include:
          - { rid: win-x64, os: ubuntu-latest }
          - { rid: linux-x64, os: ubuntu-latest }
          # The SDK only signs macOS binaries, which arm64 requires, when it runs on macOS.
          - { rid: osx-arm64, os: macos-latest }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet test -c Release
      - name: Publish
        run: dotnet publish src/Gm8Builder.Cli -c Release -r ${{ matrix.rid }} -o out/gm8-builder-${{ matrix.rid }}
      - name: Package
        working-directory: out
        run: |
          cp ../LICENSE ../README.md gm8-builder-${{ matrix.rid }}/
          zip -r gm8-builder-${{ github.ref_name }}-${{ matrix.rid }}.zip gm8-builder-${{ matrix.rid }}
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.rid }}
          path: out/*.zip

  release:
    needs: publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # This version's section of the changelog: from its heading to the next.
          awk -v v="${GITHUB_REF_NAME#v}" '/^## / { on = index($0, "## " v) == 1; next } on' CHANGELOG.md > notes.md
          gh release create "$GITHUB_REF_NAME" dist/*.zip --title "$GITHUB_REF_NAME" --notes-file notes.md
